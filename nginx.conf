# Entrega estática do build Vite e proxy de /api/ para a API, na mesma origem (DEV-021).
map $sent_http_content_type $html_cache {
    default "";
    ~*text/html "no-store";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    add_header Cache-Control $html_cache always;

    # Nome resolvido a cada uso (DNS interno do Docker): a web sobe sem a API e responde 502 enquanto ela faltar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_hide_header X-Content-Type-Options;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
